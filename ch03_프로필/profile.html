<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/profile.css">
    <title>Document</title>
    <style>
        /* 전체 페이지 설정 */
        body {
        margin: 0;
        text-align: center;
        padding: 30px 0;
      }
      /* 프로필 이미지 : 원형 */
      .profileImage {
        width: 100px;
        height: 100px;
        border-radius: 50%;
      }
      .title {
        font-size: 24px;
        font-weight: normal;
        margin: 15px 0 5px;
      }
      p {
        margin: 0;
        font-size: 16px;
        color: black;
      }
      /* 소개 영역 박스 */
      .box {
        background: steelblue;
        width: 330px;
        margin: 20px auto 0px;
        padding: 20px;
      }

      .box p{
        color: white;
        line-height: 1.5;
      }
    
    </style>
</head>
<body>
    <img src="./image/profile_img.jpg" alt="프로필이미지" class="profileImage">
    <h3 class="title">kkkbaoro</h3>
    <p>Back-End Develiper</p>
    <div class="box">
        <p>
        안녕하세요 개발자입니다
        <br>현재 백앤드 개발자로 활동중이며 <br>
        김장도 너무 잘 담금니다.
    </p>
    </div>
</body>
</html>
