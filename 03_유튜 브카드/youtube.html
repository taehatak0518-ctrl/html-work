<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;}
            .container {
                width: 720px;
                padding: 150px;
                display: flex;
                gap: 20px;
            }
            .thumbnail {
              background-image: url("../image/thymbnail.jpg");
              width: 260px;
              height: 150px;
              background-size: cover;
              background-position: center;
              /* div 태그 안에 있는 span 애들을 정렬하는 방법 */
              display: flex;
              /* 주축의 가로정렬 -주축 : 기본(가로-) */
              justify-content: end;
              /* 주죽의 세로정렬 */
              align-items: end;
              border-radius: 10px;
            }
            .thumbnail .time {
                color: white;
                margin: 5px;
                background-color: black;
                font-size: 12px;
                border-radius: 4px;
            }
            .content {
                display: flex;
                flex-direction: column;
            }
            .title {margin: 0;}
.info {
  margin: 5px 0;
  font-size: 13px;
  color: gray;
}

.channel-img {
  width: 24px;
  height: 24px;
  border-radius: 50%;
}
.channel {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: gray;
}

.desc {
  font-size: 13px;
  color: gray;
}

.footer {
  font-size: 12px;
  color: gray;
  text-align: right;
}
    </style>
</head>
<body>
    <div class="container">
        <!-- 왼쪽 썸네일 영역 -->
         <div class="thumbnail">
            <span class="time">12:24</span>
         </div>
         <!-- 오른쪽 : 글 영역 -->
          <div class="contan">
            <h3 class="title">리액트 30분 만에 끝내기 | 입문자용</h3>
            <p class="info">조회수 1.2만회`3일전</p>
            <div class="channel">
                <img src="./image/channel-jpg" alt="채널 사진">
                <span>코딩하는 미니</span>
            </div>
            <p class="desc">리액트를 처음 배우는 분들을 위한 핵심 개념 정리 영상입니다.</p>
          </div>
            <div class="footer">
                <span>👍 320</span>
                <span>💬 45</span>
            </div>

          </div>
    </div>
</body>
</html>
